<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Mario - Con Castillo y Tortugas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        #game-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 3px solid #e94560;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #5c94fc, #87CEEB);
        }
        #ui-layer {
            position: absolute;
            top: 12px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }
        #controls-panel {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #c0392b;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        button.active { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; }
        .instructions {
            font-size: 13px;
            color: #aaa;
            max-width: 650px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div>🏰 NIVEL: <span id="lbl-level">1</span>/10</div>
        <div>🪙 <span id="lbl-coins">0</span></div>
        <div>❤️ <span id="lbl-lives">3</span></div>
    </div>
    <canvas id="gameCanvas" width="900" height="500"></canvas>
</div>

<div id="controls-panel">
    <button id="btn-debug" onclick="toggleDebug()">🔍 Debug: OFF</button>
    <div class="instructions">
        <strong>🎮 Controles:</strong> ← → / A-D Moverse · ↑ / W / Espacio Saltar<br>
        💥 Salta desde abajo para romper bloques · 🐢 Patea tortugas
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 500;

// ========== ESTADOS GLOBALES ==========
let currentLevel = 1;
let totalCoins = 0;
let showDebug = false;
let cameraX = 0;
let levelWidth = 3000;
let gameState = 'playing'; // 'playing' | 'transition' | 'castle'
let transitionTimer = 0;
let castleScreen = false;
let castleTimer = 0;

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function toggleDebug() {
    showDebug = !showDebug;
    document.getElementById('btn-debug').textContent = `🔍 Debug: ${showDebug ? 'ON' : 'OFF'}`;
    document.getElementById('btn-debug').classList.toggle('active', showDebug);
}

// ========== CLASE BLOQUE ROMPIBLE ==========
class BreakableBlock {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = 32;
        this.h = 32;
        this.broken = false;
        this.bounceY = 0;
        this.bounceSpeed = 0;
        this.hitCount = 0;
        this.maxHits = 3;
        this.coinReward = false;
        this.animTimer = 0;
    }

    hit() {
        if (this.broken) return false;
        this.hitCount++;
        this.bounceY = -10;
        this.bounceSpeed = 0.6;
        
        if (Math.random() < 0.25) this.coinReward = true;
        
        if (this.hitCount >= this.maxHits) {
            this.broken = true;
            return true;
        }
        return false;
    }

    update() {
        if (this.bounceY < 0) {
            this.bounceY += this.bounceSpeed;
            this.bounceSpeed += 0.3;
        } else {
            this.bounceY = 0;
            this.bounceSpeed = 0;
        }
        this.animTimer += 0.05;
    }

    draw() {
        if (this.broken) return;
        let dx = this.x - cameraX;
        if (dx > W + 50 || dx + this.w < -50) return;
        let dy = this.y + this.bounceY;

        // Caja
        let gradient = ctx.createLinearGradient(dx, dy, dx + this.w, dy + this.h);
        gradient.addColorStop(0, '#D4A574');
        gradient.addColorStop(0.5, '#C4956A');
        gradient.addColorStop(1, '#B8860B');
        ctx.fillStyle = gradient;
        ctx.fillRect(dx, dy, this.w, this.h);
        
        // Borde
        ctx.strokeStyle = '#8B6914';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(dx, dy, this.w, this.h);
        
        // Marco interior
        ctx.strokeStyle = '#A0522D';
        ctx.lineWidth = 1;
        ctx.strokeRect(dx + 3, dy + 3, this.w - 6, this.h - 6);

        // ¿Interrogación o daño?
        ctx.fillStyle = '#FFF8DC';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let icon = this.hitCount === 0 ? '?' : '💥';
        ctx.fillText(icon, dx + this.w/2, dy + this.h/2 + 1);

        // Brillo
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(dx + 4, dy + 4, 8, 8);

        // Mostrar golpes restantes en debug
        if (showDebug) {
            ctx.fillStyle = '#00ff00';
            ctx.font = '10px monospace';
            ctx.fillText(`${this.maxHits - this.hitCount}`, dx + this.w/2, dy + this.h + 14);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.strokeRect(dx, dy, this.w, this.h);
        }
    }
}

// ========== CLASE TORTUGA (KOOPA) ==========
class Koopa {
    constructor(x, y, minX, maxX) {
        this.x = x;
        this.y = y;
        this.w = 30;
        this.h = 32;
        this.vx = 1.2;
        this.minX = minX;
        this.maxX = maxX;
        this.isShell = false;
        this.shellSpeed = 0;
        this.shellTimer = 0;
        this.facingRight = true;
        this.walkCycle = 0;
        this.alive = true;
    }

    update() {
        if (!this.alive) return;
        
        if (this.isShell) {
            this.x += this.shellSpeed;
            this.shellSpeed *= 0.995;
            
            if (Math.abs(this.shellSpeed) < 0.1) {
                this.shellSpeed = 0;
                this.shellTimer++;
                if (this.shellTimer > 100) {
                    this.isShell = false;
                    this.vx = this.facingRight ? 1 : -1;
                    this.shellTimer = 0;
                }
            }
            
            if (this.x <= this.minX) { this.x = this.minX; this.shellSpeed = Math.abs(this.shellSpeed); }
            if (this.x + this.w >= this.maxX) { this.x = this.maxX - this.w; this.shellSpeed = -Math.abs(this.shellSpeed); }
            return;
        }

        this.x += this.vx;
        this.walkCycle += 0.15;

        if (this.x <= this.minX) { this.x = this.minX; this.vx = Math.abs(this.vx); this.facingRight = true; }
        if (this.x + this.w >= this.maxX) { this.x = this.maxX - this.w; this.vx = -Math.abs(this.vx); this.facingRight = false; }
    }

    kick(speed) {
        this.isShell = true;
        this.shellSpeed = speed;
        this.shellTimer = 0;
    }

    draw() {
        if (!this.alive) return;
        let dx = this.x - cameraX;
        if (dx > W + 50 || dx + this.w < -50) return;

        // Sombra
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath();
        ctx.ellipse(dx + this.w/2, this.y + this.h + 2, 14, 4, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.save();
        ctx.translate(dx + this.w/2, this.y + this.h/2);

        if (this.isShell) {
            // Caparazón
            let grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 14);
            grad.addColorStop(0, '#4CAF50');
            grad.addColorStop(0.7, '#2E7D32');
            grad.addColorStop(1, '#1B5E20');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#1a4f33';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Detalles
            ctx.strokeStyle = 'rgba(76, 175, 80, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(-5, -5, 6, 0, Math.PI*2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(5, 5, 6, 0, Math.PI*2);
            ctx.stroke();
            
            // Ojos en el caparazón
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-3, -3, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(3, 3, 3, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.scale(this.facingRight ? 1 : -1, 1);
            
            // Cabeza
            ctx.fillStyle = '#8BC34A';
            ctx.beginPath();
            ctx.arc(0, -8, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
            
            // Ojos
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(5, -11, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-5, -11, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillRect(6, -12, 2, 3);
            ctx.fillRect(-8, -12, 2, 3);
            
            // Sonrisa
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, -5, 5, 0.1, Math.PI - 0.1);
            ctx.stroke();
            
            // Caparazón
            let grad = ctx.createRadialGradient(-3, 2, 2, 0, 4, 14);
            grad.addColorStop(0, '#4CAF50');
            grad.addColorStop(0.6, '#2E7D32');
            grad.addColorStop(1, '#1B5E20');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, 6, 13, 11, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
            
            // Patas
            ctx.fillStyle = '#8BC34A';
            let legOff = Math.sin(this.walkCycle) * 4;
            ctx.fillRect(-10, 12 + legOff, 5, 8);
            ctx.fillRect(5, 12 - legOff, 5, 8);
            ctx.strokeRect(-10, 12 + legOff, 5, 8);
            ctx.strokeRect(5, 12 - legOff, 5, 8);
        }

        ctx.restore();

        if (showDebug) {
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 1;
            ctx.strokeRect(dx, this.y, this.w, this.h);
        }
    }
}

// ========== CLASE JUGADOR ==========
class Player {
    constructor() {
        this.x = 80;
        this.y = 350;
        this.w = 26;
        this.h = 40;
        this.vx = 0;
        this.vy = 0;
        this.speed = 4.8;
        this.gravity = 0.55;
        this.jumpForce = -12;
        this.isGrounded = false;
        this.lives = 3;
        this.facingRight = true;
        this.scaleX = 1;
        this.walkCycle = 0;
        this.bobbing = 0;
        this.armAngle = 0;
        this.legAngle = 0;
        this.coyoteCounter = 0;
        this.maxCoyote = 7;
        this.isMoving = false;
        this.invincible = 0;
    }

    reset() {
        this.x = 80;
        this.y = 350;
        this.vx = 0;
        this.vy = 0;
        this.isGrounded = false;
        this.coyoteCounter = 0;
    }

    update() {
        let move = 0;
        if (keys['ArrowRight'] || keys['KeyD']) move = 1;
        if (keys['ArrowLeft'] || keys['KeyA']) move = -1;

        this.vx = move * this.speed;
        this.isMoving = Math.abs(this.vx) > 0;

        if (this.vx > 0) this.facingRight = true;
        if (this.vx < 0) this.facingRight = false;
        this.scaleX += ((this.facingRight ? 1 : -1) - this.scaleX) * 0.2;

        // Animación
        if (this.isMoving && this.isGrounded) {
            this.walkCycle += 0.2;
            this.bobbing = Math.abs(Math.sin(this.walkCycle)) * 3.5;
            this.legAngle = Math.sin(this.walkCycle) * 0.7;
            this.armAngle = Math.sin(this.walkCycle + 0.5) * 0.5;
        } else {
            this.bobbing *= 0.9;
            this.legAngle *= 0.9;
            this.armAngle *= 0.9;
        }

        // Gravedad
        if (!this.isGrounded) {
            this.vy += this.gravity;
            if (this.vy > 13) this.vy = 13;
            this.coyoteCounter--;
        } else {
            this.vy = 0;
            this.coyoteCounter = this.maxCoyote;
        }

        // Salto
        if (keys['ArrowUp'] || keys['KeyW'] || keys['Space']) {
            if (this.coyoteCounter > 0) {
                this.vy = this.jumpForce;
                this.isGrounded = false;
                this.coyoteCounter = 0;
            }
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = 0;
        if (this.x > levelWidth - this.w) this.x = levelWidth - this.w;
        if (this.y > H + 100) this.die();

        if (this.invincible > 0) this.invincible--;
    }

    die() {
        this.lives--;
        updateUI();
        if (this.lives <= 0) {
            gameState = 'transition';
            transitionTimer = 0;
            setTimeout(() => {
                currentLevel = 1;
                totalCoins = 0;
                this.lives = 3;
                loadLevel(1);
                gameState = 'playing';
            }, 1500);
        } else {
            this.reset();
            cameraX = 0;
        }
    }

    draw() {
        ctx.save();
        
        // Sombra (corregida)
        let shadowAlpha = this.isGrounded ? 0.3 : 0.15;
        let shadowSize = this.isGrounded ? 16 : 20;
        ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
        ctx.beginPath();
        ctx.ellipse(this.x + this.w/2 - cameraX, this.y + this.h + 2, shadowSize, 5, 0, 0, 0, Math.PI*2);
        ctx.fill();

        if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }

        ctx.translate(this.x + this.w/2 - cameraX, this.y + this.h/2);
        
        let squash = this.isGrounded ? 1 : (this.vy < 0 ? 1.05 : 0.93);
        ctx.scale(this.scaleX, squash);
        ctx.translate(0, -this.bobbing);

        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';

        // === GORRA ===
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.ellipse(0, -20, 13, 6, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        ctx.fillRect(-14, -22, 28, 6);
        
        // Visera
        ctx.fillStyle = '#c62828';
        ctx.fillRect(0, -18, 14, 3);

        // === CARA ===
        ctx.fillStyle = '#FFD54F';
        ctx.beginPath();
        ctx.ellipse(0, -12, 10, 9, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // Ojos
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(4, -15, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-4, -15, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(5, -16, 2, 3);
        ctx.fillRect(-7, -16, 2, 3);

        // Bigote
        ctx.fillStyle = '#4a2711';
        ctx.fillRect(0, -11, 8, 3);
        ctx.fillRect(-8, -11, 8, 3);

        // === CUERPO ===
        ctx.fillStyle = '#e53935';
        ctx.fillRect(-9, -3, 18, 13);
        ctx.strokeRect(-9, -3, 18, 13);

        // Overol
        ctx.fillStyle = '#1565C0';
        ctx.fillRect(-8, 4, 16, 11);
        ctx.strokeRect(-8, 4, 16, 11);
        
        // Botones
        ctx.fillStyle = '#FDD835';
        ctx.beginPath();
        ctx.arc(-3, 6, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(3, 6, 2.5, 0, Math.PI*2);
        ctx.fill();

        // === BRAZOS ===
        ctx.fillStyle = '#FFD54F';
        ctx.save();
        ctx.translate(-10, -1);
        ctx.rotate(this.armAngle);
        ctx.fillRect(-2, 0, 4, 12);
        ctx.strokeRect(-2, 0, 4, 12);
        ctx.restore();

        ctx.save();
        ctx.translate(10, -1);
        ctx.rotate(-this.armAngle);
        ctx.fillRect(-2, 0, 4, 12);
        ctx.strokeRect(-2, 0, 4, 12);
        ctx.restore();

        // === PIERNAS ===
        ctx.fillStyle = '#1565C0';
        ctx.save();
        ctx.translate(-4, 12);
        ctx.rotate(this.legAngle);
        ctx.fillRect(-3, 0, 6, 12);
        ctx.strokeRect(-3, 0, 6, 12);
        ctx.restore();

        ctx.save();
        ctx.translate(4, 12);
        ctx.rotate(-this.legAngle);
        ctx.fillRect(-3, 0, 6, 12);
        ctx.strokeRect(-3, 0, 6, 12);
        ctx.restore();

        // Zapatos
        ctx.fillStyle = '#6D4C41';
        ctx.fillRect(-7, 22, 7, 5);
        ctx.fillRect(0, 22, 7, 5);
        ctx.strokeRect(-7, 22, 7, 5);
        ctx.strokeRect(0, 22, 7, 5);

        ctx.restore();

        if (showDebug) {
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(this.x - cameraX, this.y, this.w, this.h);
        }
    }
}

// ========== CLASE ENEMIGO GOOMBA ==========
class Goomba {
    constructor(x, y, minX, maxX) {
        this.x = x;
        this.y = y;
        this.w = 28;
        this.h = 28;
        this.vx = 1;
        this.minX = minX;
        this.maxX = maxX;
        this.walkCycle = Math.random() * 10;
        this.alive = true;
    }

    update() {
        if (!this.alive) return;
        this.x += this.vx;
        this.walkCycle += 0.1;

        if (this.x <= this.minX) { this.x = this.minX; this.vx = Math.abs(this.vx); }
        if (this.x + this.w >= this.maxX) { this.x = this.maxX - this.w; this.vx = -Math.abs(this.vx); }
    }

    draw() {
        if (!this.alive) return;
        let dx = this.x - cameraX;
        if (dx > W + 50 || dx + this.w < -50) return;

        ctx.save();
        ctx.translate(dx + this.w/2, this.y + this.h/2);
        let bob = Math.sin(this.walkCycle) * 2;
        
        // Sombra
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, this.h/2 + 3, 12, 3, 0, 0, Math.PI*2);
        ctx.fill();

        // Cuerpo
        ctx.fillStyle = '#8D6E63';
        ctx.beginPath();
        ctx.ellipse(0, -4 + bob, 14, 12, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // Ojos enojados
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-5, -8 + bob, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(5, -8 + bob, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#1a1a2e';
        let eyeDir = this.vx > 0 ? 1 : -1;
        ctx.fillRect(-5 + eyeDir*2, -10 + bob, 2, 4);
        ctx.fillRect(5 + eyeDir*2, -10 + bob, 2, 4);
        
        // Cejas enojadas
        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-9, -13 + bob);
        ctx.lineTo(-2, -11 + bob);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(9, -13 + bob);
        ctx.lineTo(2, -11 + bob);
        ctx.stroke();

        // Boca
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(-4, -2 + bob, 8, 2);

        ctx.restore();

        if (showDebug) {
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 1;
            ctx.strokeRect(dx, this.y, this.w, this.h);
        }
    }
}

// ========== ELEMENTOS DEL JUEGO ==========
let platforms = [];
let coins = [];
let breakableBlocks = [];
let koopas = [];
let goombas = [];
let goalFlag = { x: 0, y: 0, w: 24, h: 180 };
let castle = { x: 0, y: 0, w: 120, h: 140 };
const player = new Player();

// ========== CARGAR NIVEL ==========
function loadLevel(level) {
    platforms = [];
    coins = [];
    breakableBlocks = [];
    koopas = [];
    goombas = [];
    castleScreen = false;
    gameState = 'playing';
    
    levelWidth = 1800 + level * 350;
    player.reset();
    cameraX = 0;

    // Suelo inicial
    platforms.push({ x: 0, y: 420, w: 350, h: 80 });
    platforms.push({ x: 0, y: 450, w: levelWidth + 400, h: 50 });

    let currentX = 350;
    let currentY = 420;
    
    // Usamos el nivel como semilla
    const seed = level * 137 + 42;
    let rand = (function(s) {
        return function() {
            s = (s * 9301 + 49297) % 233280;
            return s / 233280;
        };
    })(level * 777 + 123);

    while (currentX < levelWidth - 350) {
        let r = rand();

        if (r < 0.25) {
            // Plataforma con bloques
            let w = 120 + rand() * 120;
            platforms.push({ x: currentX, y: currentY, w: w, h: 80 });
            
            let numBlocks = Math.floor(w / 45);
            for (let i = 0; i < numBlocks; i++) {
                let bx = currentX + 15 + i * 40;
                let by = currentY - 45;
                breakableBlocks.push(new BreakableBlock(bx, by));
            }
            
            spawnCoins(currentX, currentY, w);
            currentX += w;

        } else if (r < 0.45) {
            // Tubería
            let ph = 35 + rand() * 35;
            let pw = 45;
            platforms.push({ x: currentX, y: currentY, w: 100, h: 80 });
            platforms.push({ x: currentX + 27, y: currentY - ph, w: pw, h: ph + 80 });
            
            // Bloque arriba
            if (level > 2) {
                breakableBlocks.push(new BreakableBlock(currentX + 34, currentY - ph - 45));
            }
            currentX += 100;

        } else if (r < 0.65) {
            // Foso con plataforma
            let pitW = 100 + rand() * 60;
            let nextY = currentY + (rand() * 80 - 40);
            nextY = Math.max(340, Math.min(440, nextY));

            let platW = 55;
            let platX = currentX + pitW/2 - platW/2;
            let platY = Math.min(currentY, nextY) - 25;

            platforms.push({ x: platX, y: platY, w: platW, h: 15 });
            coins.push({ x: platX + platW/2 - 10, y: platY - 35, w: 18, h: 18, collected: false });

            if (level > 3) {
                koopas.push(new Koopa(platX + 5, platY - 32, platX, platX + platW - 30));
            }

            let nextW = 120 + rand() * 80;
            platforms.push({ x: currentX + pitW, y: nextY, w: nextW, h: 80 });
            currentY = nextY;
            currentX += pitW + nextW;

        } else {
            // Zona con enemigos
            let w = 140 + rand() * 120;
            platforms.push({ x: currentX, y: currentY, w: w, h: 80 });
            
            // Bloques
            for (let i = 0; i < 3; i++) {
                let bx = currentX + 30 + i * 40;
                let by = currentY - 45 - (i % 2) * 35;
                breakableBlocks.push(new BreakableBlock(bx, by));
            }
            
            // Goombas
            let numGoombas = Math.min(Math.floor(level / 2) + 1, 4);
            for (let i = 0; i < numGoombas; i++) {
                let gx = currentX + 30 + i * 50;
                goombas.push(new Goomba(gx, currentY - 28, currentX, currentX + w - 28));
            }
            
            // Koopas (niveles más altos)
            if (level > 4) {
                koopas.push(new Koopa(currentX + 60, currentY - 32, currentX, currentX + w - 30));
            }
            
            spawnCoins(currentX, currentY, w);
            currentX += w;
        }
    }

    // Zona final con castillo
    platforms.push({ x: currentX, y: 420, w: 400, h: 80 });
    
    // Bandera
    goalFlag.x = currentX + 80;
    goalFlag.y = 420 - goalFlag.h;
    
    // Castillo (visible desde lejos)
    castle.x = currentX + 220;
    castle.y = 420 - castle.h;

    updateUI();
}

function spawnCoins(x, y, width) {
    let count = Math.floor(width / 50);
    for (let i = 0; i < count; i++) {
        coins.push({
            x: x + 20 + i * 42,
            y: y - 35,
            w: 16,
            h: 16,
            collected: false
        });
    }
}

function updateUI() {
    document.getElementById('lbl-level').textContent = currentLevel;
    document.getElementById('lbl-coins').textContent = totalCoins;
    document.getElementById('lbl-lives').textContent = player.lives;
}

// ========== COLISIONES ==========
function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

function getPlayerRect() {
    return { x: player.x, y: player.y, w: player.w, h: player.h };
}

// ========== DIBUJAR CASTILLO ==========
function drawCastle() {
    let dx = castle.x - cameraX;
    if (dx > W + 50 || dx + castle.w < -50) return;
    
    // Cuerpo del castillo
    ctx.fillStyle = '#8D6E63';
    ctx.fillRect(dx + 10, castle.y + 30, castle.w - 20, castle.h - 30);
    
    // Torres
    ctx.fillStyle = '#6D4C41';
    ctx.fillRect(dx, castle.y, 20, 50);
    ctx.fillRect(dx + castle.w - 20, castle.y, 20, 50);
    
    // Techos de torres
    ctx.fillStyle = '#C62828';
    ctx.beginPath();
    ctx.moveTo(dx, castle.y + 10);
    ctx.lineTo(dx + 10, castle.y - 10);
    ctx.lineTo(dx + 20, castle.y + 10);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(dx + castle.w - 20, castle.y + 10);
    ctx.lineTo(dx + castle.w - 10, castle.y - 10);
    ctx.lineTo(dx + castle.w, castle.y + 10);
    ctx.fill();
    
    // Puerta
    ctx.fillStyle = '#4E342E';
    ctx.beginPath();
    ctx.arc(dx + castle.w/2, castle.y + castle.h - 10, 15, 0, Math.PI);
    ctx.fill();
    
    // Ventanas
    ctx.fillStyle = '#FFD54F';
    ctx.fillRect(dx + 30, castle.y + 50, 12, 12);
    ctx.fillRect(dx + castle.w - 42, castle.y + 50, 12, 12);
    ctx.fillRect(dx + castle.w/2 - 6, castle.y + 60, 12, 12);
    
    // Bandera en el castillo
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(dx + castle.w/2 - 2, castle.y - 5, 4, 15);
    ctx.fillStyle = '#F44336';
    ctx.beginPath();
    ctx.moveTo(dx + castle.w/2 + 2, castle.y - 5);
    ctx.lineTo(dx + castle.w/2 + 25, castle.y + 2);
    ctx.lineTo(dx + castle.w/2 + 2, castle.y + 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '14px Arial';
    ctx.fillText('★', dx + castle.w/2 + 10, castle.y + 6);
}

// ========== DIBUJAR BANDERA ==========
function drawFlag() {
    let dx = goalFlag.x - cameraX;
    if (dx > W + 50 || dx + goalFlag.w < -50) return;
    
    // Poste
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(dx + 10, goalFlag.y, 4, goalFlag.h);
    
    // Esfera
    ctx.fillStyle = '#FDD835';
    ctx.beginPath();
    ctx.arc(dx + 12, goalFlag.y, 6, 0, Math.PI*2);
    ctx.fill();
    
    // Bandera
    let wave = Math.sin(Date.now() / 500) * 3;
    ctx.fillStyle = '#43A047';
    ctx.beginPath();
    ctx.moveTo(dx + 14, goalFlag.y + 15);
    ctx.quadraticCurveTo(dx + 45 + wave, goalFlag.y + 25, dx + 14, goalFlag.y + 45);
    ctx.fill();
    ctx.strokeStyle = '#2E7D32';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // Estrella
    ctx.fillStyle = '#fff';
    ctx.font = '18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('★', dx + 30 + wave/2, goalFlag.y + 35);
}

// ========== BUCLE PRINCIPAL ==========
function gameLoop() {
    if (gameState === 'playing') {
        // Actualizar
        player.update();

        // Cámara
        let targetCam = player.x - W * 0.35;
        cameraX += (targetCam - cameraX) * 0.08;
        cameraX = Math.max(0, Math.min(levelWidth - W, cameraX));

        // Colisiones con plataformas
        player.isGrounded = false;
        for (let p of platforms) {
            if (rectCollide(player, p)) {
                if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 5) {
                    player.y = p.y - player.h;
                    player.isGrounded = true;
                    player.vy = 0;
                } else if (player.vx > 0 && player.x + player.w - player.vx <= p.x) {
                    player.x = p.x - player.w;
                } else if (player.vx < 0 && player.x - player.vx >= p.x + p.w) {
                    player.x = p.x + p.w;
                }
            }
        }

        // Bloques rompibles
        for (let b of breakableBlocks) {
            b.update();
            if (b.broken) continue;
            if (rectCollide(player, b)) {
                if (player.vy < 0 && player.y - player.vy >= b.y + b.h - 2) {
                    if (b.hit()) {
                        totalCoins += 5;
                        updateUI();
                    }
                    player.vy = 2;
                } else if (player.vx > 0 && player.x + player.w - player.vx <= b.x) {
                    player.x = b.x - player.w;
                } else if (player.vx < 0 && player.x - player.vx >= b.x + b.w) {
                    player.x = b.x + b.w;
                } else if (player.vy > 0 && player.y + player.h - player.vy <= b.y + 2) {
                    player.y = b.y - player.h;
                    player.isGrounded = true;
                    player.vy = 0;
                }
            }
        }

        // Monedas
        for (let c of coins) {
            if (!c.collected && rectCollide(player, c)) {
                c.collected = true;
                totalCoins += 1;
                updateUI();
            }
        }

        // Goombas
        for (let i = goombas.length - 1; i >= 0; i--) {
            let g = goombas[i];
            g.update();
            if (rectCollide(player, g)) {
                if (player.vy > 0 && player.y + player.h - player.vy <= g.y + 8) {
                    goombas.splice(i, 1);
                    player.vy = -8;
                    totalCoins += 2;
                    updateUI();
                } else {
                    player.die();
                }
            }
        }

        // Koopas
        for (let i = koopas.length - 1; i >= 0; i--) {
            let k = koopas[i];
            k.update();
            if (rectCollide(player, k)) {
                if (player.vy > 0 && player.y + player.h - player.vy <= k.y + 8) {
                    if (!k.isShell) {
                        k.kick(7 * (player.x < k.x ? -1 : 1));
                        player.vy = -7;
                    } else {
                        if (Math.abs(k.shellSpeed) < 1) {
                            k.shellSpeed = 8 * (player.x < k.x ? -1 : 1);
                        } else {
                            k.shellSpeed *= 1.3;
                        }
                        player.vy = -6;
                    }
                    totalCoins += 2;
                    updateUI();
                } else if (k.isShell && Math.abs(k.shellSpeed) > 2) {
                    player.die();
                } else if (!k.isShell) {
                    player.die();
                }
            }
        }

        // ¡BANDERA! → Transición al castillo
        if (rectCollide(player, goalFlag)) {
            gameState = 'castle';
            castleTimer = 0;
            player.vx = 0;
            player.vy = 0;
            // Reproducir efecto de victoria
        }
    }

    // ===== ESTADO CASTILLO (TRANSICIÓN ESPECIAL) =====
    if (gameState === 'castle') {
        castleTimer++;
        
        // Animar cámara hacia el castillo
        let targetCam = castle.x - W * 0.3;
        cameraX += (targetCam - cameraX) * 0.05;
        
        // Después de 2 segundos, mostrar mensaje
        if (castleTimer > 120 && castleTimer < 180) {
            // Mostrar "NIVEL COMPLETADO"
        }
        
        // Después de 3 segundos, cargar siguiente nivel o terminar
        if (castleTimer > 240) {
            if (currentLevel < 10) {
                gameState = 'transition';
                setTimeout(() => {
                    currentLevel++;
                    loadLevel(currentLevel);
                }, 1000);
            } else {
                gameState = 'transition';
                setTimeout(() => {
                    currentLevel = 1;
                    totalCoins = 0;
                    player.lives = 3;
                    loadLevel(1);
                }, 2000);
            }
        }
    }

    // ===== DIBUJAR =====
    ctx.clearRect(0, 0, W, H);
    
    // Cielo con gradiente
    let grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#5C94FC');
    grad.addColorStop(0.6, '#87CEEB');
    grad.addColorStop(1, '#B5D8F7');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Nubes
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 5; i++) {
        let cx = (i * 300 + 100 - cameraX * 0.3) % (W + 200) - 100;
        let cy = 30 + i * 25 % 60;
        ctx.beginPath();
        ctx.arc(cx, cy, 30, 0, Math.PI*2);
        ctx.arc(cx + 30, cy - 10, 25, 0, Math.PI*2);
        ctx.arc(cx + 60, cy, 30, 0, Math.PI*2);
        ctx.fill();
    }

    // Plataformas
    for (let p of platforms) {
        let dx = p.x - cameraX;
        if (dx > W + 10 || dx + p.w < -10) continue;
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(dx, p.y, p.w, p.h);
        ctx.strokeStyle = '#5D4037';
        ctx.lineWidth = 2;
        ctx.strokeRect(dx, p.y, p.w, p.h);
        
        // Textura de pasto
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(dx, p.y, p.w, 6);
        ctx.fillStyle = '#388E3C';
        for (let g = 0; g < p.w; g += 12) {
            ctx.fillRect(dx + g, p.y - 3, 2, 6);
        }
    }

    // Bloques
    for (let b of breakableBlocks) b.draw();

    // Monedas (con animación de brillo)
    for (let c of coins) {
        if (c.collected) continue;
        let dx = c.x - cameraX;
        if (dx > W + 20 || dx + c.w < -20) continue;
        let shine = Math.sin(Date.now() / 300 + c.x) * 0.3 + 0.7;
        ctx.fillStyle = `rgba(255, 215, 0, ${shine})`;
        ctx.shadowColor = 'rgba(255, 215, 0, 0.6)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.ellipse(dx + c.w/2, c.y + c.h/2, c.w/2, c.h/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#DAA520';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    // Goombas
    for (let g of goombas) g.draw();

    // Koopas
    for (let k of koopas) k.draw();

    // Castillo (siempre visible al final)
    drawCastle();

    // Bandera
    drawFlag();

    // Jugador
    player.draw();

    // ===== UI DE TRANSICIÓN =====
    if (gameState === 'castle' && castleTimer > 60) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 52px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 20;
        ctx.fillText('🏰 ¡NIVEL COMPLETADO!', W/2, H/2 - 30);
        
        ctx.fillStyle = '#fff';
        ctx.font = '28px Arial';
        ctx.fillText(`⭐ ${totalCoins} monedas`, W/2, H/2 + 50);
        ctx.shadowBlur = 0;
    }

    if (gameState === 'transition') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⏳ Cargando...', W/2, H/2);
    }

    // Debug info
    if (showDebug) {
        ctx.fillStyle = '#fff';
        ctx.font = '12px monospace';
        ctx.fillText(`FPS: 60 | Nivel: ${currentLevel} | Coins: ${totalCoins}`, 10, 20);
    }

    requestAnimationFrame(gameLoop);
}

// ========== INICIAR ==========
loadLevel(1);
gameLoop();

console.log('🎮 ¡Juego con CASTILLO y todas las mejoras activado!');
</script>
