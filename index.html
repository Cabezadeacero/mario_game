<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Mario - Edición Mejorada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        #game-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 40px rgba(100, 200, 255, 0.1);
            border: 3px solid #2a2a4a;
        }
        canvas {
            display: block;
            background: #5c94fc;
        }
        #ui-layer {
            position: absolute;
            top: 12px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            font-size: 17px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }
        #ui-layer span {
            background: rgba(0,0,0,0.4);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #controls-panel {
            margin-top: 14px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #8a1a2e;
            letter-spacing: 0.5px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #8a1a2e; }
        button:active { transform: translateY(4px); box-shadow: 0 1px 0 #8a1a2e; }
        button.active { background: linear-gradient(135deg, #2ecc71, #27ae60); box-shadow: 0 4px 0 #1a6e3a; }
        .instructions {
            font-size: 12px;
            color: #8888aa;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
            background: rgba(255,255,255,0.03);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .instructions strong { color: #aaccff; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div><span>🏰 <span id="lbl-level">1</span>/10</span></div>
        <div><span>🪙 <span id="lbl-coins">0</span></span></div>
        <div><span>❤️ <span id="lbl-lives">3</span></span></div>
    </div>
    <canvas id="gameCanvas" width="900" height="500"></canvas>
</div>

<div id="controls-panel">
    <button id="btn-debug" onclick="toggleDebug()">🎯 Debug</button>
    <div class="instructions">
        <strong>← →</strong> Mover · <strong>↑ / W / Espacio</strong> Saltar · <strong>Golpea bloques desde abajo</strong> para romperlos · ¡Llega al castillo!
    </div>
</div>

<script>
// ============================================================
// PAPER MARIO - VERSIÓN MEJORADA CON ESTÉTICA BONITA
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 500;

// --- ESTADOS ---
let currentLevel = 1;
let totalCoins = 0;
let showDebug = false;
let cameraX = 0;
let levelWidth = 3000;
let gameState = 'playing';
let castleTimer = 0;

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function toggleDebug() {
    showDebug = !showDebug;
    document.getElementById('btn-debug').classList.toggle('active', showDebug);
}

// ============================================================
// CLASE BLOQUE ROMPIBLE (ESTILO PAPER MARIO)
// ============================================================
class BreakableBlock {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = 34;
        this.h = 34;
        this.broken = false;
        this.bounceY = 0;
        this.hitCount = 0;
        this.maxHits = 3;
        this.particles = [];
        this.shakeTimer = 0;
    }

    hit() {
        if (this.broken) return false;
        this.hitCount++;
        this.bounceY = -12;
        this.shakeTimer = 8;
        
        // Crear partículas de impacto
        for (let i = 0; i < 6; i++) {
            this.particles.push({
                x: this.x + this.w/2,
                y: this.y + this.h,
                vx: (Math.random() - 0.5) * 4,
                vy: -Math.random() * 5 - 2,
                life: 30 + Math.random() * 20,
                size: 3 + Math.random() * 4,
                color: ['#FFD700', '#FFA500', '#FF6B6B', '#FFEAA7'][Math.floor(Math.random() * 4)]
            });
        }

        if (this.hitCount >= this.maxHits) {
            this.broken = true;
            // Explosión de partículas
            for (let i = 0; i < 20; i++) {
                this.particles.push({
                    x: this.x + this.w/2,
                    y: this.y + this.h/2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 3,
                    life: 40 + Math.random() * 30,
                    size: 4 + Math.random() * 6,
                    color: ['#CD853F', '#D4A574', '#8B6914', '#FFD700'][Math.floor(Math.random() * 4)]
                });
            }
            return true;
        }
        return false;
    }

    update() {
        // Actualizar partículas
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15;
            p.life--;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        if (this.bounceY < 0) {
            this.bounceY += 0.8;
        } else {
            this.bounceY = 0;
        }
        if (this.shakeTimer > 0) this.shakeTimer--;
    }

    draw() {
        if (this.broken) {
            // Dibujar partículas
            for (let p of this.particles) {
                let alpha = p.life / 50;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - cameraX - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            return;
        }

        let dx = this.x - cameraX;
        let dy = this.y + this.bounceY;
        if (dx > W + 50 || dx + this.w < -50) return;

        // Sombra del bloque
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(dx + this.w/2, this.y + this.h + 4, this.w/2 - 2, 5, 0, 0, Math.PI*2);
        ctx.fill();

        // SHAKE
        let shakeX = 0, shakeY = 0;
        if (this.shakeTimer > 0) {
            shakeX = (Math.random() - 0.5) * 4;
            shakeY = (Math.random() - 0.5) * 4;
        }

        ctx.save();
        ctx.translate(shakeX, shakeY);

        // Caja principal con gradiente
        let grad = ctx.createLinearGradient(dx, dy, dx + this.w, dy + this.h);
        let color1 = this.hitCount === 0 ? '#F5D6A8' : '#E8C8A0';
        let color2 = this.hitCount === 0 ? '#D4A574' : '#C4956A';
        grad.addColorStop(0, color1);
        grad.addColorStop(0.5, color2);
        grad.addColorStop(1, '#B8860B');
        ctx.fillStyle = grad;
        
        // Borde redondeado
        let r = 4;
        ctx.beginPath();
        ctx.moveTo(dx + r, dy);
        ctx.lineTo(dx + this.w - r, dy);
        ctx.quadraticCurveTo(dx + this.w, dy, dx + this.w, dy + r);
        ctx.lineTo(dx + this.w, dy + this.h - r);
        ctx.quadraticCurveTo(dx + this.w, dy + this.h, dx + this.w - r, dy + this.h);
        ctx.lineTo(dx + r, dy + this.h);
        ctx.quadraticCurveTo(dx, dy + this.h, dx, dy + this.h - r);
        ctx.lineTo(dx, dy + r);
        ctx.quadraticCurveTo(dx, dy, dx + r, dy);
        ctx.closePath();
        ctx.fill();
        
        // Borde
        ctx.strokeStyle = '#8B6914';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Marco interior brillante
        ctx.strokeStyle = 'rgba(255,255,200,0.3)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(dx + 4, dy + 4, this.w - 8, this.h - 8);

        // Ícono central
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 22px Arial';
        
        if (this.hitCount === 0) {
            // Signo de interrogación
            ctx.fillStyle = '#FFF8DC';
            ctx.shadowColor = 'rgba(255,215,0,0.3)';
            ctx.shadowBlur = 10;
            ctx.fillText('?', dx + this.w/2 + 1, dy + this.h/2 + 1);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#DAA520';
            ctx.fillText('?', dx + this.w/2, dy + this.h/2);
        } else {
            // Mostrar cuántos golpes quedan
            let remaining = this.maxHits - this.hitCount;
            ctx.fillStyle = '#FF6B6B';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('💥'.repeat(remaining), dx + this.w/2, dy + this.h/2 + 1);
        }

        // Brillo esquina
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(dx + 3, dy + 3, 8, 8);

        ctx.restore();

        if (showDebug) {
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(dx, dy, this.w, this.h);
            ctx.fillStyle = '#00ff88';
            ctx.font = '10px monospace';
            ctx.fillText(`💥${this.hitCount}/${this.maxHits}`, dx, dy - 8);
        }
    }
}

// ============================================================
// CLASE TORTUGA (KOOPA) - ESTILO PAPER
// ============================================================
class Koopa {
    constructor(x, y, minX, maxX) {
        this.x = x;
        this.y = y;
        this.w = 30;
        this.h = 32;
        this.vx = 1.2;
        this.minX = minX;
        this.maxX = maxX;
        this.isShell = false;
        this.shellSpeed = 0;
        this.shellTimer = 0;
        this.facingRight = true;
        this.walkCycle = 0;
        this.alive = true;
        this.bounceY = 0;
    }

    update() {
        if (!this.alive) return;
        
        // Rebote suave
        this.bounceY = Math.sin(this.walkCycle * 2) * 1.5;
        
        if (this.isShell) {
            this.x += this.shellSpeed;
            this.shellSpeed *= 0.995;
            
            if (Math.abs(this.shellSpeed) < 0.1) {
                this.shellSpeed = 0;
                this.shellTimer++;
                if (this.shellTimer > 90) {
                    this.isShell = false;
                    this.vx = this.facingRight ? 1 : -1;
                    this.shellTimer = 0;
                }
            }
            
            if (this.x <= this.minX) { this.x = this.minX; this.shellSpeed = Math.abs(this.shellSpeed); }
            if (this.x + this.w >= this.maxX) { this.x = this.maxX - this.w; this.shellSpeed = -Math.abs(this.shellSpeed); }
            return;
        }

        this.x += this.vx;
        this.walkCycle += 0.12;

        if (this.x <= this.minX) { this.x = this.minX; this.vx = Math.abs(this.vx); this.facingRight = true; }
        if (this.x + this.w >= this.maxX) { this.x = this.maxX - this.w; this.vx = -Math.abs(this.vx); this.facingRight = false; }
    }

    kick(speed) {
        this.isShell = true;
        this.shellSpeed = speed;
        this.shellTimer = 0;
    }

    draw() {
        if (!this.alive) return;
        let dx = this.x - cameraX;
        if (dx > W + 50 || dx + this.w < -50) return;

        // Sombra
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(dx + this.w/2, this.y + this.h + 3, 14, 4, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.save();
        ctx.translate(dx + this.w/2, this.y + this.h/2 + this.bounceY);

        if (this.isShell) {
            // Caparazón con brillo
            let grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 15);
            grad.addColorStop(0, '#66BB6A');
            grad.addColorStop(0.5, '#43A047');
            grad.addColorStop(1, '#1B5E20');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#0d3b0d';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Detalles del caparazón
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(-5, -5, 6, 0, Math.PI*2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(5, 5, 6, 0, Math.PI*2);
            ctx.stroke();
            
            // Ojos en el caparazón (cuando está quieto)
            if (Math.abs(this.shellSpeed) < 0.5) {
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.arc(-4, -4, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(4, 4, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(-5, -5, 2, 2);
                ctx.fillRect(3, 3, 2, 2);
            }
        } else {
            ctx.scale(this.facingRight ? 1 : -1, 1);
            
            // Cabeza
            ctx.fillStyle = '#A5D6A7';
            ctx.beginPath();
            ctx.arc(0, -8, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            // Ojos grandes y tiernos
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(5, -11, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-5, -11, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(6, -12, 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-4, -12, 2.5, 0, Math.PI*2);
            ctx.fill();
            
            // Sonrisa
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -5, 6, 0.1, Math.PI - 0.1);
            ctx.stroke();
            
            // Caparazón principal
            let grad = ctx.createRadialGradient(-3, 2, 2, 0, 6, 15);
            grad.addColorStop(0, '#66BB6A');
            grad.addColorStop(0.5, '#43A047');
            grad.addColorStop(1, '#1B5E20');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, 6, 14, 12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#0d3b0d';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Patas
            ctx.fillStyle = '#A5D6A7';
            let legOff = Math.sin(this.walkCycle) * 3;
            ctx.fillRect(-10, 13 + legOff, 5, 7);
            ctx.fillRect(5, 13 - legOff, 5, 7);
            ctx.strokeRect(-10, 13 + legOff, 5, 7);
            ctx.strokeRect(5, 13 - legOff, 5, 7);
        }

        ctx.restore();

        if (showDebug) {
            ctx.strokeStyle = '#ff66ff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(dx, this.y, this.w, this.h);
        }
    }
}

// ============================================================
// CLASE ENEMIGO GOOMBA (ESTILO PAPER)
// ============================================================
class Goomba {
    constructor(x, y, minX, maxX) {
        this.x = x;
        this.y = y;
        this.w = 30;
        this.h = 30;
        this.vx = 0.9;
        this.minX = minX;
        this.maxX = maxX;
        this.walkCycle = Math.random() * 10;
        this.alive = true;
        this.bounceY = 0;
    }

    update() {
        if (!this.alive) return;
        this.x += this.vx;
        this.walkCycle += 0.1;
        this.bounceY = Math.sin(this.walkCycle * 2) * 2;

        if (this.x <= this.minX) { this.x = this.minX; this.vx = Math.abs(this.vx); }
        if (this.x + this.w >= this.maxX) { this.x = this.maxX - this.w; this.vx = -Math.abs(this.vx); }
    }

    draw() {
        if (!this.alive) return;
        let dx = this.x - cameraX;
        if (dx > W + 50 || dx + this.w < -50) return;

        // Sombra
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(dx + this.w/2, this.y + this.h + 2, 12, 3, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.save();
        ctx.translate(dx + this.w/2, this.y + this.h/2 + this.bounceY);
        
        // Cuerpo (hongo)
        let grad = ctx.createRadialGradient(-3, -5, 2, 0, 0, 16);
        grad.addColorStop(0, '#BCAAA4');
        grad.addColorStop(0.6, '#8D6E63');
        grad.addColorStop(1, '#5D4037');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, -2, 15, 13, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#3E2723';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Parte inferior (cuerpo)
        ctx.fillStyle = '#D7CCC8';
        ctx.beginPath();
        ctx.ellipse(0, 10, 10, 8, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // Ojos enojados
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-5, -5, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(5, -5, 5, 0, Math.PI*2);
        ctx.fill();
        
        ctx.fillStyle = '#1a1a2e';
        let eyeDir = this.vx > 0 ? 1 : -1;
        ctx.beginPath();
        ctx.arc(-5 + eyeDir*2, -4, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(5 + eyeDir*2, -4, 2.5, 0, Math.PI*2);
        ctx.fill();
        
        // Cejas enojadas
        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-9, -10);
        ctx.lineTo(-2, -8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(9, -10);
        ctx.lineTo(2, -8);
        ctx.stroke();

        // Boca
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(-5, 1, 10, 3);
        ctx.fillRect(-3, 4, 6, 2);

        ctx.restore();

        if (showDebug) {
            ctx.strokeStyle = '#ff66ff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(dx, this.y, this.w, this.h);
        }
    }
}

// ============================================================
// CLASE JUGADOR (PAPER MARIO) - ESTÉTICA MEJORADA
// ============================================================
class Player {
    constructor() {
        this.x = 80;
        this.y = 350;
        this.w = 28;
        this.h = 42;
        this.vx = 0;
        this.vy = 0;
        this.speed = 5;
        this.gravity = 0.55;
        this.jumpForce = -12.5;
        this.isGrounded = false;
        this.lives = 3;
        this.facingRight = true;
        this.scaleX = 1;
        this.walkCycle = 0;
        this.bobbing = 0;
        this.armAngle = 0;
        this.legAngle = 0;
        this.coyoteCounter = 0;
        this.maxCoyote = 8;
        this.isMoving = false;
        this.invincible = 0;
        this.dustParticles = [];
    }

    reset() {
        this.x = 80;
        this.y = 350;
        this.vx = 0;
        this.vy = 0;
        this.isGrounded = false;
        this.coyoteCounter = 0;
        this.dustParticles = [];
    }

    update() {
        let move = 0;
        if (keys['ArrowRight'] || keys['KeyD']) move = 1;
        if (keys['ArrowLeft'] || keys['KeyA']) move = -1;

        this.vx = move * this.speed;
        this.isMoving = Math.abs(this.vx) > 0;

        if (this.vx > 0) this.facingRight = true;
        if (this.vx < 0) this.facingRight = false;
        this.scaleX += ((this.facingRight ? 1 : -1) - this.scaleX) * 0.2;

        // Animación
        if (this.isMoving && this.isGrounded) {
            this.walkCycle += 0.18;
            this.bobbing = Math.abs(Math.sin(this.walkCycle)) * 3.5;
            this.legAngle = Math.sin(this.walkCycle) * 0.7;
            this.armAngle = Math.sin(this.walkCycle + 0.5) * 0.5;
            
            // Partículas de polvo al caminar
            if (Math.random() < 0.2) {
                this.dustParticles.push({
                    x: this.x + (this.facingRight ? 0 : this.w),
                    y: this.y + this.h,
                    vx: (Math.random() - 0.5) * 1,
                    vy: -Math.random() * 1.5 - 0.5,
                    life: 20 + Math.random() * 15,
                    size: 3 + Math.random() * 4
                });
            }
        } else {
            this.bobbing *= 0.9;
            this.legAngle *= 0.9;
            this.armAngle *= 0.9;
        }

        // Polvo
        for (let i = this.dustParticles.length - 1; i >= 0; i--) {
            let p = this.dustParticles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) this.dustParticles.splice(i, 1);
        }

        // Gravedad
        if (!this.isGrounded) {
            this.vy += this.gravity;
            if (this.vy > 14) this.vy = 14;
            this.coyoteCounter--;
        } else {
            this.vy = 0;
            this.coyoteCounter = this.maxCoyote;
        }

        // Salto
        if (keys['ArrowUp'] || keys['KeyW'] || keys['Space']) {
            if (this.coyoteCounter > 0) {
                this.vy = this.jumpForce;
                this.isGrounded = false;
                this.coyoteCounter = 0;
                // Partículas de salto
                for (let i = 0; i < 8; i++) {
                    this.dustParticles.push({
                        x: this.x + this.w/2,
                        y: this.y + this.h,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -Math.random() * 3 - 1,
                        life: 15 + Math.random() * 15,
                        size: 4 + Math.random() * 5
                    });
                }
            }
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = 0;
        if (this.x > levelWidth - this.w) this.x = levelWidth - this.w;
        if (this.y > H + 100) this.die();

        if (this.invincible > 0) this.invincible--;
    }

    die() {
        this.lives--;
        updateUI();
        if (this.lives <= 0) {
            gameState = 'transition';
            setTimeout(() => {
                currentLevel = 1;
                totalCoins = 0;
                this.lives = 3;
                loadLevel(1);
                gameState = 'playing';
            }, 1500);
        } else {
            this.reset();
            cameraX = 0;
        }
    }

    draw() {
        ctx.save();
        
        // --- POLVO ---
        for (let p of this.dustParticles) {
            let alpha = p.life / 30;
            ctx.globalAlpha = alpha * 0.4;
            ctx.fillStyle = '#D7CCC8';
            ctx.beginPath();
            ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // --- SOMBRA MEJORADA ---
        let shadowAlpha = this.isGrounded ? 0.35 : 0.15;
        let shadowSize = this.isGrounded ? 18 : 22;
        ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
        ctx.beginPath();
        ctx.ellipse(this.x + this.w/2 - cameraX, this.y + this.h + 3, shadowSize, 5, 0, 0, 0, Math.PI*2);
        ctx.fill();

        if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }

        ctx.translate(this.x + this.w/2 - cameraX, this.y + this.h/2);
        
        let squash = this.isGrounded ? 1 : (this.vy < 0 ? 1.06 : 0.92);
        ctx.scale(this.scaleX, squash);
        ctx.translate(0, -this.bobbing);

        ctx.strokeStyle = '#1a1a2e';
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';

        // === GORRA ===
        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.ellipse(0, -22, 14, 7, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        ctx.fillRect(-15, -25, 30, 7);
        
        // Visera
        ctx.fillStyle = '#C62828';
        ctx.fillRect(0, -20, 16, 4);
        ctx.fillRect(-1, -17, 14, 3);

        // === CARA ===
        ctx.fillStyle = '#FFD54F';
        ctx.beginPath();
        ctx.ellipse(0, -13, 11, 10, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // Ojos
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(4, -16, 4.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-4, -16, 4.5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(5, -17, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-3, -17, 2.5, 0, Math.PI*2);
        ctx.fill();

        // Bigote
        ctx.fillStyle = '#4E342E';
        ctx.fillRect(0, -12, 9, 3);
        ctx.fillRect(-9, -12, 9, 3);
        ctx.fillRect(-10, -10, 20, 2);

        // === CUERPO ===
        ctx.fillStyle = '#E53935';
        ctx.fillRect(-10, -2, 20, 14);
        ctx.strokeRect(-10, -2, 20, 14);

        // Overol
        ctx.fillStyle = '#1565C0';
        ctx.fillRect(-9, 5, 18, 12);
        ctx.strokeRect(-9, 5, 18, 12);
        
        // Botones
        ctx.fillStyle = '#FDD835';
        ctx.beginPath();
        ctx.arc(-4, 7, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(4, 7, 3, 0, Math.PI*2);
        ctx.fill();
        
        // Bolsillo
        ctx.strokeStyle = '#0D47A1';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-5, 11, 10, 4);

        // === BRAZOS ===
        ctx.fillStyle = '#FFD54F';
        ctx.save();
        ctx.translate(-12, 0);
        ctx.rotate(this.armAngle);
        ctx.fillRect(-2.5, 0, 5, 13);
        ctx.strokeRect(-2.5, 0, 5, 13);
        ctx.restore();

        ctx.save();
        ctx.translate(12, 0);
        ctx.rotate(-this.armAngle);
        ctx.fillRect(-2.5, 0, 5, 13);
        ctx.strokeRect(-2.5, 0, 5, 13);
        ctx.restore();

        // === PIERNAS ===
        ctx.fillStyle = '#1565C0';
        ctx.save();
        ctx.translate(-5, 14);
        ctx.rotate(this.legAngle);
        ctx.fillRect(-3.5, 0, 7, 13);
        ctx.strokeRect(-3.5, 0, 7, 13);
        ctx.restore();

        ctx.save();
        ctx.translate(5, 14);
        ctx.rotate(-this.legAngle);
        ctx.fillRect(-3.5, 0, 7, 13);
        ctx.strokeRect(-3.5, 0, 7, 13);
        ctx.restore();

        // Zapatos
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-8, 25, 8, 5);
        ctx.fillRect(0, 25, 8, 5);
        ctx.strokeRect(-8, 25, 8, 5);
        ctx.strokeRect(0, 25, 8, 5);
        
        // Suela
        ctx.fillStyle = '#3E2723';
        ctx.fillRect(-8, 28, 8, 2);
        ctx.fillRect(0, 28, 8, 2);

        ctx.restore();

        if (showDebug) {
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(this.x - cameraX, this.y, this.w, this.h);
        }
    }
}

// ============================================================
// ELEMENTOS DEL JUEGO
// ============================================================
let platforms = [];
let coins = [];
let breakableBlocks = [];
let koopas = [];
let goombas = [];
let goalFlag = { x: 0, y: 0, w: 24, h: 180 };
let castle = { x: 0, y: 0, w: 130, h: 150 };
const player = new Player();

// ============================================================
// CARGAR NIVEL - CON BLOQUES EN EL AIRE
// ============================================================
function loadLevel(level) {
    platforms = [];
    coins = [];
    breakableBlocks = [];
    koopas = [];
    goombas = [];
    gameState = 'playing';
    castleTimer = 0;
    
    levelWidth = 1800 + level * 350;
    player.reset();
    cameraX = 0;

    // SUELO BASE
    platforms.push({ x: -50, y: 440, w: 400, h: 60 });
    platforms.push({ x: -50, y: 480, w: levelWidth + 500, h: 30 });

    let currentX = 350;
    let currentY = 440;
    
    const seed = level * 137 + 42;
    let rand = (function(s) {
        return function() {
            s = (s * 9301 + 49297) % 233280;
            return s / 233280;
        };
    })(level * 777 + 123);

    while (currentX < levelWidth - 350) {
        let r = rand();

        if (r < 0.25) {
            // Plataforma con BLOQUES EN EL AIRE
            let w = 120 + rand() * 120;
            platforms.push({ x: currentX, y: currentY, w: w, h: 40 });
            
            // BLOQUES FLOTANDO (para golpear con la cabeza)
            let numBlocks = Math.floor(w / 50);
            for (let i = 0; i < Math.min(numBlocks, 4); i++) {
                let bx = currentX + 20 + i * 42;
                let by = currentY - 65 - (i % 2) * 30; // ¡En el aire!
                breakableBlocks.push(new BreakableBlock(bx, by));
            }
            
            spawnCoins(currentX, currentY - 30, w);
            currentX += w;

        } else if (r < 0.45) {
            // Tubería con BLOQUE ARRIBA
            let ph = 35 + rand() * 35;
            let pw = 45;
            platforms.push({ x: currentX, y: currentY, w: 100, h: 40 });
            platforms.push({ x: currentX + 27, y: currentY - ph, w: pw, h: ph + 40 });
            
            // Bloque FLOTANDO sobre la tubería
            if (level > 1) {
                breakableBlocks.push(new BreakableBlock(currentX + 30, currentY - ph - 55));
            }
            currentX += 100;

        } else if (r < 0.65) {
            // Foso con plataforma
            let pitW = 100 + rand() * 60;
            let nextY = currentY + (rand() * 80 - 40);
            nextY = Math.max(360, Math.min(460, nextY));

            let platW = 55;
            let platX = currentX + pitW/2 - platW/2;
            let platY = Math.min(currentY, nextY) - 25;

            platforms.push({ x: platX, y: platY, w: platW, h: 15 });
            coins.push({ x: platX + platW/2 - 10, y: platY - 40, w: 18, h: 18, collected: false });

            // BLOQUE FLOTANDO sobre el foso
            if (level > 2) {
                breakableBlocks.push(new BreakableBlock(platX + platW/2 - 17, platY - 55));
            }

            if (level > 3) {
                koopas.push(new Koopa(platX + 5, platY - 32, platX, platX + platW - 30));
            }

            let nextW = 120 + rand() * 80;
            platforms.push({ x: currentX + pitW, y: nextY, w: nextW, h: 40 });
            currentY = nextY;
            currentX += pitW + nextW;

        } else {
            // Zona con enemigos y BLOQUES FLOTANTES
            let w = 140 + rand() * 120;
            platforms.push({ x: currentX, y: currentY, w: w, h: 40 });
            
            // BLOQUES FLOTANDO
            for (let i = 0; i < 3; i++) {
                let bx = currentX + 30 + i * 42;
                let by = currentY - 70 - (i % 2) * 25;
                breakableBlocks.push(new BreakableBlock(bx, by));
            }
            
            // Goombas
            let numGoombas = Math.min(Math.floor(level / 2) + 1, 4);
            for (let i = 0; i < numGoombas; i++) {
                let gx = currentX + 30 + i * 50;
                goombas.push(new Goomba(gx, currentY - 30, currentX, currentX + w - 30));
            }
            
            // Koopas (niveles altos)
            if (level > 4) {
                koopas.push(new Koopa(currentX + 60, currentY - 32, currentX, currentX + w - 30));
            }
            
            spawnCoins(currentX, currentY - 30, w);
            currentX += w;
        }
    }

    // ZONA FINAL - CASTILLO
    platforms.push({ x: currentX, y: 440, w: 400, h: 40 });
    
    // Bandera
    goalFlag.x = currentX + 80;
    goalFlag.y = 440 - goalFlag.h;
    
    // Castillo (visible)
    castle.x = currentX + 220;
    castle.y = 440 - castle.h;

    updateUI();
}

function spawnCoins(x, y, width) {
    let count = Math.floor(width / 50);
    for (let i = 0; i < count; i++) {
        coins.push({
            x: x + 20 + i * 42,
            y: y - 10,
            w: 16,
            h: 16,
            collected: false
        });
    }
}

function updateUI() {
    document.getElementById('lbl-level').textContent = currentLevel;
    document.getElementById('lbl-coins').textContent = totalCoins;
    document.getElementById('lbl-lives').textContent = player.lives;
}

// ============================================================
// COLISIONES
// ============================================================
function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

function getPlayerRect() {
    return { x: player.x, y: player.y, w: player.w, h: player.h };
}

// ============================================================
// DIBUJAR CASTILLO (BONITO)
// ============================================================
function drawCastle() {
    let dx = castle.x - cameraX;
    if (dx > W + 50 || dx + castle.w < -50) return;
    
    // Sombra del castillo
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(dx + castle.w/2, castle.y + castle.h + 5, 70, 8, 0, 0, Math.PI*2);
    ctx.fill();
    
    // Cuerpo principal
    let grad = ctx.createLinearGradient(dx, castle.y, dx + castle.w, castle.y + castle.h);
    grad.addColorStop(0, '#A1887F');
    grad.addColorStop(0.5, '#8D6E63');
    grad.addColorStop(1, '#6D4C41');
    ctx.fillStyle = grad;
    ctx.fillRect(dx + 10, castle.y + 30, castle.w - 20, castle.h - 30);
    ctx.strokeStyle = '#4E342E';
    ctx.lineWidth = 2;
    ctx.strokeRect(dx + 10, castle.y + 30, castle.w - 20, castle.h - 30);
    
    // Torres laterales
    ctx.fillStyle = '#795548';
    ctx.fillRect(dx, castle.y, 22, 55);
    ctx.fillRect(dx + castle.w - 22, castle.y, 22, 55);
    ctx.strokeRect(dx, castle.y, 22, 55);
    ctx.strokeRect(dx + castle.w - 22, castle.y, 22, 55);
    
    // Techos de torres (triángulos)
    ctx.fillStyle = '#C62828';
    ctx.beginPath();
    ctx.moveTo(dx - 2, castle.y + 10);
    ctx.lineTo(dx + 11, castle.y - 15);
    ctx.lineTo(dx + 24, castle.y + 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(dx + castle.w - 24, castle.y + 10);
    ctx.lineTo(dx + castle.w - 11, castle.y - 15);
    ctx.lineTo(dx + castle.w + 2, castle.y + 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Puerta
    ctx.fillStyle = '#3E2723';
    ctx.beginPath();
    ctx.arc(dx + castle.w/2, castle.y + castle.h - 8, 16, 0, Math.PI);
    ctx.fill();
    ctx.stroke();
    
    // Ventanas
    ctx.fillStyle = '#FFD54F';
    ctx.shadowColor = 'rgba(255, 213, 79, 0.4)';
    ctx.shadowBlur = 12;
    ctx.fillRect(dx + 30, castle.y + 55, 14, 14);
    ctx.fillRect(dx + castle.w - 44, castle.y + 55, 14, 14);
    ctx.fillRect(dx + castle.w/2 - 8, castle.y + 65, 16, 16);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#4E342E';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(dx + 30, castle.y + 55, 14, 14);
    ctx.strokeRect(dx + castle.w - 44, castle.y + 55, 14, 14);
    ctx.strokeRect(dx + castle.w/2 - 8, castle.y + 65, 16, 16);
    
    // BANDERA DEL CASTILLO
    ctx.fillStyle = '#4E342E';
    ctx.fillRect(dx + castle.w/2 - 2, castle.y - 8, 4, 18);
    ctx.fillStyle = '#E53935';
    ctx.beginPath();
    ctx.moveTo(dx + castle.w/2 + 2, castle.y - 8);
    ctx.lineTo(dx + castle.w/2 + 30, castle.y + 2);
    ctx.lineTo(dx + castle.w/2 + 2, castle.y + 12);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#FFD700';
    ctx.font = '14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('⭐', dx + castle.w/2 + 14, castle.y + 5);
}

// ============================================================
// DIBUJAR BANDERA
// ============================================================
function drawFlag() {
    let dx = goalFlag.x - cameraX;
    if (dx > W + 50 || dx + goalFlag.w < -50) return;
    
    // Poste
    let grad = ctx.createLinearGradient(dx, goalFlag.y, dx + 4, goalFlag.y + goalFlag.h);
    grad.addColorStop(0, '#8D6E63');
    grad.addColorStop(1, '#4E342E');
    ctx.fillStyle = grad;
    ctx.fillRect(dx + 10, goalFlag.y, 4, goalFlag.h);
    
    // Esfera
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(dx + 12, goalFlag.y + 2, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Bandera (con animación)
    let wave = Math.sin(Date.now() / 400) * 4;
    ctx.fillStyle = '#43A047';
    ctx.beginPath();
    ctx.moveTo(dx + 14, goalFlag.y + 12);
    ctx.quadraticCurveTo(dx + 48 + wave, goalFlag.y + 22, dx + 14, goalFlag.y + 48);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#2E7D32';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // Estrella
    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('★', dx + 30 + wave/2, goalFlag.y + 34);
}

// ============================================================
// BUCLE PRINCIPAL
// ============================================================
function gameLoop() {
    if (gameState === 'playing') {
        player.update();

        // Cámara
        let targetCam = player.x - W * 0.35;
        cameraX += (targetCam - cameraX) * 0.08;
        cameraX = Math.max(0, Math.min(levelWidth - W, cameraX));

        // Colisiones con plataformas
        player.isGrounded = false;
        for (let p of platforms) {
            if (rectCollide(player, p)) {
                if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 5) {
                    player.y = p.y - player.h;
                    player.isGrounded = true;
                    player.vy = 0;
                } else if (player.vx > 0 && player.x + player.w - player.vx <= p.x) {
                    player.x = p.x - player.w;
                } else if (player.vx < 0 && player.x - player.vx >= p.x + p.w) {
                    player.x = p.x + p.w;
                }
            }
        }

        // BLOQUES ROMPIBLES - GOLPEAR DESDE ABAJO
        for (let b of breakableBlocks) {
            b.update();
            if (b.broken) continue;
            if (rectCollide(player, b)) {
                // ¡GOLPE DESDE ABAJO! (con la cabeza)
                if (player.vy < 0 && player.y - player.vy >= b.y + b.h - 2) {
                    if (b.hit()) {
                        totalCoins += 5;
                        updateUI();
                    }
                    player.vy = 2; // Rebote al golpear
                }
                // Colisión lateral
                else if (player.vx > 0 && player.x + player.w - player.vx <= b.x) {
                    player.x = b.x - player.w;
                } else if (player.vx < 0 && player.x - player.vx >= b.x + b.w) {
                    player.x = b.x + b.w;
                }
                // Caer encima
                else if (player.vy > 0 && player.y + player.h - player.vy <= b.y + 2) {
                    player.y = b.y - player.h;
                    player.isGrounded = true;
                    player.vy = 0;
                }
            }
        }

        // Monedas
        for (let c of coins) {
            if (!c.collected && rectCollide(player, c)) {
                c.collected = true;
                totalCoins++;
                updateUI();
            }
        }

        // Goombas
        for (let i = goombas.length - 1; i >= 0; i--) {
            let g = goombas[i];
            g.update();
            if (rectCollide(player, g)) {
                if (player.vy > 0 && player.y + player.h - player.vy <= g.y + 8) {
                    goombas.splice(i, 1);
                    player.vy = -8;
                    totalCoins += 2;
                    updateUI();
                } else {
                    player.die();
                }
            }
        }

        // Koopas
        for (let i = koopas.length - 1; i >= 0; i--) {
            let k = koopas[i];
            k.update();
            if (rectCollide(player, k)) {
                if (player.vy > 0 && player.y + player.h - player.vy <= k.y + 8) {
                    if (!k.isShell) {
                        k.kick(7 * (player.x < k.x ? -1 : 1));
                        player.vy = -7;
                    } else {
                        if (Math.abs(k.shellSpeed) < 1) {
                            k.shellSpeed = 8 * (player.x < k.x ? -1 : 1);
                        } else {
                            k.shellSpeed *= 1.3;
                        }
                        player.vy = -6;
                    }
                    totalCoins += 2;
                    updateUI();
                } else if (k.isShell && Math.abs(k.shellSpeed) > 2) {
                    player.die();
                } else if (!k.isShell) {
                    player.die();
                }
            }
        }

        // BANDERA → CASTILLO
        if (rectCollide(player, goalFlag)) {
            gameState = 'castle';
            castleTimer = 0;
            player.vx = 0;
            player.vy = 0;
        }
    }

    // ===== ESTADO CASTILLO =====
    if (gameState === 'castle') {
        castleTimer++;
        let targetCam = castle.x - W * 0.3;
        cameraX += (targetCam - cameraX) * 0.05;
        
        if (castleTimer > 180) {
            if (currentLevel < 10) {
                gameState = 'transition';
                setTimeout(() => {
                    currentLevel++;
                    loadLevel(currentLevel);
                }, 800);
            } else {
                gameState = 'transition';
                setTimeout(() => {
                    currentLevel = 1;
                    totalCoins = 0;
                    player.lives = 3;
                    loadLevel(1);
                }, 1500);
            }
        }
    }

    // ===== DIBUJAR =====
    ctx.clearRect(0, 0, W, H);
    
    // Cielo
    let skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#4A90D9');
    skyGrad.addColorStop(0.5, '#7EC8E3');
    skyGrad.addColorStop(0.8, '#B5D8F7');
    skyGrad.addColorStop(1, '#E8F4FD');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
    
    // Nubes
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for (let i = 0; i < 6; i++) {
        let cx = (i * 280 + 80 - cameraX * 0.2) % (W + 200) - 100;
        let cy = 30 + i * 20 % 80;
        ctx.beginPath();
        ctx.arc(cx, cy, 35 + i * 5, 0, Math.PI*2);
        ctx.arc(cx + 35, cy - 12, 30 + i * 3, 0, Math.PI*2);
        ctx.arc(cx + 70, cy, 35 + i * 4, 0, Math.PI*2);
        ctx.fill();
    }

    // Plataformas (estilo pasto)
    for (let p of platforms) {
        let dx = p.x - cameraX;
        if (dx > W + 20 || dx + p.w < -20) continue;
        
        // Tierra
        let grad = ctx.createLinearGradient(dx, p.y, dx, p.y + p.h);
        grad.addColorStop(0, '#8D6E63');
        grad.addColorStop(0.3, '#795548');
        grad.addColorStop(1, '#5D4037');
        ctx.fillStyle = grad;
        ctx.fillRect(dx, p.y, p.w, p.h);
        ctx.strokeStyle = '#4E342E';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(dx, p.y, p.w, p.h);
        
        // Pasto
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(dx, p.y, p.w, 6);
        ctx.fillStyle = '#388E3C';
        for (let g = 0; g < p.w; g += 10) {
            let height = 4 + Math.sin(g * 0.5 + Date.now() * 0.001) * 3;
            ctx.fillRect(dx + g, p.y - height + 6, 2, height);
        }
        ctx.fillStyle = '#66BB6A';
        for (let g = 5; g < p.w; g += 10) {
            let height = 3 + Math.cos(g * 0.7 + Date.now() * 0.0012) * 2;
            ctx.fillRect(dx + g, p.y - height + 6, 1.5, height);
        }
    }

    // Monedas
    for (let c of coins) {
        if (c.collected) continue;
        let dx = c.x - cameraX;
        if (dx > W + 20 || dx + c.w < -20) continue;
        let shine = Math.sin(Date.now() / 200 + c.x) * 0.3 + 0.7;
        ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
        ctx.shadowBlur = 18;
        let grad = ctx.createRadialGradient(dx + 4, c.y + 4, 2, dx + 8, c.y + 8, 10);
        grad.addColorStop(0, '#FFF176');
        grad.addColorStop(0.5, '#FFD700');
        grad.addColorStop(1, '#F9A825');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(dx + c.w/2, c.y + c.h/2, c.w/2, c.h/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Brillo
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.ellipse(dx + 4, c.y + 4, 3, 3, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // Goombas
    for (let g of goombas) g.draw();

    // Koopas
    for (let k of koopas) k.draw();

    // Bloques
    for (let b of breakableBlocks) b.draw();

    // Castillo
    drawCastle();

    // Bandera
    drawFlag();

    // Jugador
    player.draw();

    // ===== UI TRANSICIÓN CASTILLO =====
    if (gameState === 'castle' && castleTimer > 60) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 56px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🏰', W/2, H/2 - 50);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px Arial';
        ctx.fillText('¡NIVEL COMPLETADO!', W/2, H/2 + 30);
        ctx.fillStyle = '#FFD700';
        ctx.font = '28px Arial';
        ctx.fillText(`🪙 ${totalCoins} monedas`, W/2, H/2 + 80);
        ctx.shadowBlur = 0;
    }

    if (gameState === 'transition') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⏳ Cargando...', W/2, H/2);
    }

    // Debug
    if (showDebug) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(5, 5, 150, 22);
        ctx.fillStyle = '#00ff88';
        ctx.font = '12px monospace';
        ctx.fillText(`Nivel ${currentLevel} | 🪙 ${totalCoins}`, 12, 22);
        
        // Mostrar posición de bloques
        for (let b of breakableBlocks) {
            if (!b.broken) {
                ctx.fillStyle = '#00ff88';
                ctx.font = '8px monospace';
                let dx = b.x - cameraX;
                ctx.fillText(`⬆️GOLPEA`, dx + b.w/2 - 15, b.y - 10);
            }
        }
    }

    requestAnimationFrame(gameLoop);
}

// ============================================================
// INICIAR
// ============================================================
loadLevel(1);
gameLoop();

console.log('🎮 ¡Paper Mario con ESTÉTICA MEJORADA y BLOQUES EN EL AIRE!');
</script>
